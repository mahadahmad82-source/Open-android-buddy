name: Android Build

# Builds the Open Buddy APK on GitHub's runners.
# - Push to main / pull requests: debug APK (auto-signed with a CI-generated debug key).
# - Manual run (Actions tab -> Android Build -> Run workflow) with build_type=release:
#   signed release APK + AAB, using repository secrets:
#     KEYSTORE_BASE64  (base64 of my-upload-key.jks)
#     STORE_PASSWORD
#     KEY_PASSWORD

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        options: [debug, release]
        default: debug

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners ship the Android SDK (ANDROID_HOME is pre-set);
      # the setup-android action proved unreliable, so use the built-in SDK.
      - name: Install Android platform 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          if [ -z "$SDKMANAGER" ]; then echo "::error::sdkmanager not found (ANDROID_HOME=$ANDROID_HOME)"; ls "$ANDROID_HOME" || true; exit 1; fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # No keystore generation here: debug.keystore is committed to the repo so
      # every CI build is signed with the SAME debug key and new builds install
      # cleanly over previous ones. (Generating a fresh key per run caused
      # "The app wasn't installed" signature conflicts on device.)

      - name: Decode release keystore
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret KEYSTORE_BASE64 is not set. Add it (base64 of my-upload-key.jks) plus STORE_PASSWORD and KEY_PASSWORD before running a release build."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks

      - name: Build debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build-output.log

      - name: Build release APK + AAB
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease bundleRelease --stacktrace 2>&1 | tee build-output.log

      # Actions logs need sign-in to read, so on failure the important Gradle
      # lines are posted as a PR comment (and into the job summary) automatically.
      - name: Report build failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build-output.log', 'utf8'); } catch (e) {}
            const lines = log.split('\n');
            const interesting = lines.filter(l => /^e: |error:|FAILURE|What went wrong|Caused by:|BUILD FAILED|Exception/.test(l)).slice(0, 60);
            const tail = lines.slice(-60);
            const body = [
              '## CI build failed — Gradle output (auto-posted)',
              '',
              'Key lines:',
              '```',
              ...(interesting.length ? interesting : ['(no key lines matched)']),
              '```',
              '',
              'Last lines of the build:',
              '```',
              ...tail,
              '```'
            ].join('\n').slice(0, 60000);
            try { fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, body); } catch (e) {}
            if (context.eventName === 'pull_request') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            } else if (context.eventName === 'push') {
              // Branch pushes have no PR to comment on: post the failure
              // output as a commit comment so it is readable via the API.
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body
              });
            }

      - name: Upload debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: open-buddy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release artifacts
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: open-buddy-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
