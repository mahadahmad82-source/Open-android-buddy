name: Release APK (direct download)

# Publishes the debug APK as a GitHub Release asset so it can be downloaded
# as a raw .apk file (no artifact .zip extraction) and installed directly.
# Trigger: push a tag like apk-v1.0.0, or run manually from the Actions tab.

permissions:
  contents: write

on:
  push:
    tags: ["apk-v*"]
  workflow_dispatch:

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          if [ -z "$SDKMANAGER" ]; then echo "::error::sdkmanager not found"; exit 1; fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/app-debug.apk open-buddy.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Open Buddy APK ${{ github.ref_name }}
          body: |
            Direct-download APK for on-device testing.

            Install: open the open-buddy.apk link below on the phone, download, tap the file, Install.
            Signed with the shared debug key committed in this repo, so future builds install over this one.
          files: open-buddy.apk
